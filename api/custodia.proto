syntax = "proto3";

package custodia;

option go_package = "github.com/max-marek-projects/custodia/pkg/proto;proto";

service Custodia {
  // ========== AUTH ==========
  rpc RegisterUser (LoginRequest) returns (LoginResponse);
  rpc LoginUser (LoginRequest) returns (LoginResponse);
  rpc Refresh (RefreshRequest) returns (RefreshResponse);
  rpc LogoutDevice (LogoutDeviceRequest) returns (LogoutDeviceResponse);
  rpc LogoutAllDevices (LogoutAllDevicesRequest) returns (LogoutAllDevicesResponse);
  // ========== SECRETS ==========
  rpc CreateSecret (CreateSecretRequest) returns (CreateSecretResponse);
  rpc GetSecret (GetSecretRequest) returns (GetSecretResponse);
  rpc RollbackSecret (RollbackSecretRequest) returns (RollbackSecretResponse);
  rpc DeleteSecret (DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc UpdateSecretData (UpdateSecretDataRequest) returns (UpdateSecretDataResponse);
  rpc UpdateSecretMetadata (UpdateSecretMetadataRequest) returns (UpdateSecretMetadataResponse);
}


// ========== AUTH ==========

message LoginRequest {
	string login = 1;
	string password = 2;
  string device_name = 3;
}

message LoginResponse {
  int64 user_id = 1;
  string access_token = 2;
  bytes refresh_token = 3;
}

message RefreshRequest {
  int64 user_id = 1;
  bytes refresh_token = 2;
  string device_name = 3;
}

message RefreshResponse {
  string access_token = 1;
}

message LogoutDeviceRequest {
  string device_name = 2;
}

message LogoutDeviceResponse {}

message LogoutAllDevicesRequest {}

message LogoutAllDevicesResponse {}

// ========== SECRETS ==========

enum DataType {
  DATA_TYPE_CREDENTIALS = 0;
  DATA_TYPE_TEXT = 1;
  DATA_TYPE_BINARY = 2;
  DATA_TYPE_CARD = 3;
}


message CreateSecretRequest {
  string name = 1;
	DataType type = 2;
	bytes data = 3;
  map<string, string> metadata = 4;
  bytes salt = 5;
  bytes iv = 6;
}

message CreateSecretResponse {}

message GetSecretRequest {
  string name = 1;
	DataType type = 2;
  uint64 version = 3;
}

message GetSecretResponse {
  bytes data = 1;
  bytes salt = 2;
  bytes iv = 3;
  map<string, string> metadata = 4;
}

message RollbackSecretRequest {
  string name = 1;
}

message RollbackSecretResponse {

}

message DeleteSecretRequest {
  string name = 1;
}

message DeleteSecretResponse {

}

message UpdateSecretDataRequest {
  string name = 1;
	bytes data = 2;
  bytes salt = 3;
  bytes iv = 4;
}

message UpdateSecretDataResponse {}

message UpdateSecretMetadataRequest {
  string name = 1;
  map<string, string> metadata = 2;
}

message UpdateSecretMetadataResponse {}